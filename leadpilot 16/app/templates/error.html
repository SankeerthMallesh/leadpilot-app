<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800">
  <div class="flex h-full items-center justify-center p-6">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
      <div class="text-5xl font-semibold text-indigo-600">{{ status }}</div>
      <h1 class="mt-2 text-xl font-semibold">{{ title }}</h1>
      <p class="mt-2 text-sm text-slate-600">{{ message }}</p>
      {% if request_id %}<p class="mt-4 text-xs text-slate-400">Request ID: {{ request_id }}</p>{% endif %}
      <a href="/" class="mt-6 inline-block rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Back to dashboard</a>
    </div>
  </div>
</body>
</html>
