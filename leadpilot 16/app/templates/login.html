<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gradient-to-br from-indigo-50 via-white to-slate-100 antialiased">
  <div class="flex h-full items-center justify-center p-4">
    <form method="post" action="/login" class="w-full max-w-sm space-y-4 rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-indigo-100/50">
      <div class="text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-xl bg-indigo-600 text-white">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <h1 class="mt-3 text-xl font-semibold tracking-tight text-slate-900">{{ app_name }}</h1>
        <p class="text-sm text-slate-500">Sign in to continue</p>
      </div>
      {% if error %}<div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ error }}</div>{% endif %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block text-sm font-medium text-slate-700">Email
        <input name="email" type="email" required autofocus autocomplete="username" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-normal focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"></label>
      <label class="block text-sm font-medium text-slate-700">Password
        <input name="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-normal focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"></label>
      <label class="block text-sm font-medium text-slate-700">Authenticator code <span class="font-normal text-slate-400">(only if enabled)</span>
        <input name="totp_code" inputmode="numeric" autocomplete="one-time-code" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-normal focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"></label>
      <button class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-700">Log in</button>
    </form>
  </div>
</body>
</html>
