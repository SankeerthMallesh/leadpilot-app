{% if not messages %}
  <div class="empty-hint rounded-xl border border-dashed border-slate-300 p-4 text-center text-sm text-slate-500">
    Ask anything about this client, targeting, copy, or compliance.<br>Tap a suggestion below to start.
  </div>
{% endif %}
{% for m in messages %}
  {% if m.role == "user" %}
    <div class="flex justify-end">
      <div class="max-w-[85%] whitespace-pre-wrap break-words rounded-2xl rounded-br-sm bg-indigo-600 px-3 py-2 text-sm text-white">{{ m.content }}</div>
    </div>
  {% else %}
    <div class="flex items-start gap-2" data-bubble>
      <span class="mt-1 grid h-6 w-6 shrink-0 place-items-center rounded-full bg-indigo-100 text-xs text-indigo-700">AI</span>
      <div class="max-w-[88%]">
        <div class="break-words rounded-2xl rounded-tl-sm bg-slate-100 px-3 py-2 text-sm text-slate-800">{{ m.content | md }}</div>
        <button type="button" data-copy class="mt-1 text-xs text-slate-400 hover:text-slate-600">Copy</button>
      </div>
    </div>
  {% endif %}
{% endfor %}
